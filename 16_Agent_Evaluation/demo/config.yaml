# ============================================================
# Cloud Agent Evaluation Framework - Configuration
# ============================================================

evaluation:
  name: "Cloud Agent Benchmark 2026 Q2"
  version: "1.0.0"
  mode: "simulation"  # simulation | live
  parallel_workers: 4
  timeout_per_task: 60  # seconds

# CAPER Five-Dimension Weights
scoring:
  weights:
    knowledge: 0.25        # 知识问答准确率
    task_completion: 0.25  # 任务完成率
    cost_performance: 0.20 # 性价比
    interaction: 0.15      # 交互质量
    safety: 0.15           # 安全合规

  # Grade mapping
  grades:
    S: { min: 90, label: "卓越", color: "#FFD700" }
    A: { min: 80, label: "优秀", color: "#4CAF50" }
    B: { min: 70, label: "良好", color: "#2196F3" }
    C: { min: 60, label: "合格", color: "#FF9800" }
    D: { min: 0,  label: "待改进", color: "#F44336" }

# Datasets
datasets:
  knowledge_qa: "datasets/cloud_knowledge_qa.json"
  task_completion: "datasets/task_completion.json"
  safety_test: "datasets/safety_test.json"
  interaction_quality: "datasets/interaction_quality.json"

# Agent plugins to evaluate
agents:
  - id: "tongyi-agent"
    name: "通义千问 Agent"
    vendor: "阿里云"
    category: "domestic_cloud"
    plugin: "aliyun_plugin"
    config:
      model: "qwen-max"
      api_base: "https://dashscope.aliyuncs.com/api/v1"

  - id: "deepseek-agent"
    name: "DeepSeek Agent"
    vendor: "深度求索"
    category: "domestic_cloud"
    plugin: "mock_plugin"

  - id: "wenxin-agent"
    name: "文心智能体"
    vendor: "百度"
    category: "domestic_cloud"
    plugin: "mock_plugin"

  - id: "doubao-agent"
    name: "火山方舟/豆包"
    vendor: "字节跳动"
    category: "domestic_cloud"
    plugin: "mock_plugin"

  - id: "yuanqi-agent"
    name: "腾讯元器"
    vendor: "腾讯云"
    category: "domestic_cloud"
    plugin: "mock_plugin"

  - id: "pangu-agent"
    name: "盘古 Agent"
    vendor: "华为云"
    category: "domestic_cloud"
    plugin: "mock_plugin"

  - id: "spark-agent"
    name: "讯飞星火 Agent"
    vendor: "科大讯飞"
    category: "domestic_cloud"
    plugin: "mock_plugin"

  - id: "bedrock-agent"
    name: "AWS Bedrock Agent"
    vendor: "Amazon"
    category: "international_cloud"
    plugin: "mock_plugin"

  - id: "azure-agent"
    name: "Azure AI Agent"
    vendor: "Microsoft"
    category: "international_cloud"
    plugin: "mock_plugin"

  - id: "vertex-agent"
    name: "GCP Vertex AI Agent"
    vendor: "Google"
    category: "international_cloud"
    plugin: "mock_plugin"

  - id: "claude-agent"
    name: "Claude Agent"
    vendor: "Anthropic"
    category: "general_chat"
    plugin: "openai_plugin"
    config:
      model: "claude-3-opus"

  - id: "chatgpt-agent"
    name: "ChatGPT Agent"
    vendor: "OpenAI"
    category: "general_chat"
    plugin: "openai_plugin"
    config:
      model: "gpt-4o"

  - id: "gemini-agent"
    name: "Gemini Agent"
    vendor: "Google"
    category: "general_chat"
    plugin: "mock_plugin"

  - id: "databricks-agent"
    name: "Databricks Agent"
    vendor: "Databricks"
    category: "international_cloud"
    plugin: "mock_plugin"

  - id: "snowflake-agent"
    name: "Snowflake Cortex"
    vendor: "Snowflake"
    category: "international_cloud"
    plugin: "mock_plugin"

# Output
output:
  results_dir: "results"
  report_format: "json"  # json | html | markdown
  export_leaderboard: true
  leaderboard_path: "results/sample_results.json"
