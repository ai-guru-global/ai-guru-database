<!DOCTYPE html><html><head><style>html{background:#FAF8F5;}
body{width:720pt;height:405pt;margin:0;padding:0;background:#FAF8F5;font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif;display:flex;flex-direction:column;}
.hdr{background:#1C2833;padding:11pt 26pt 9pt 26pt;display:flex;align-items:center;}
.hdr .act{background:#E67E22;padding:3pt 9pt;margin-right:12pt;border-radius:3pt;}
.hdr .act p{color:#ffffff;font-size:10pt;margin:0;}
.hdr h1{color:#ffffff;font-size:19pt;margin:0;}
.body{padding:12pt 28pt 0 28pt;flex:1;}
.ftr{display:flex;justify-content:space-between;padding:4pt 28pt 6pt 28pt;}
.ftr p{color:#7F8C8D;font-size:8pt;margin:0;}
h2{color:#1C2833;font-size:14pt;margin:6pt 0 5pt 0;}
h3{color:#2E4053;font-size:12pt;margin:4pt 0 3pt 0;}
p{font-size:11pt;color:#2C3E50;margin:3pt 0;line-height:1.45;}
ul,ol{margin:3pt 0 3pt 16pt;padding:0;}
li{font-size:11pt;color:#2C3E50;margin:2.5pt 0;line-height:1.4;}
.card{background:#ffffff;border-radius:6pt;padding:9pt 12pt;box-shadow:1px 1px 5px rgba(0,0,0,0.10);}
.accent-l{border-left:5pt solid #E67E22;}
.warn{border-left:5pt solid #C0392B;}
.ok{border-left:5pt solid #16A085;}
.placeholder{background:#E8E6E1;border-radius:4pt;}
.cols{display:flex;gap:12pt;}
.col{flex:1;}</style></head><body>
<div class="hdr"><div class="act"><p>第五幕 · 调试</p></div><h1>输出不对？失败归因三步法</h1></div>
<div class="body">
<div class="cols" style="align-items:stretch;">
<div class="col">
<div class="card" style="text-align:center;border-top:4pt solid #E67E22;">
<h3>① 模型理解任务了吗？</h3>
<p>否 → <b>指令问题</b>：补角色 / 任务 / 约束</p>
</div>
</div>
<div class="col">
<div class="card" style="text-align:center;border-top:4pt solid #2E86C1;">
<h3>② 有足够信息吗？</h3>
<p>否 → <b>信息问题</b>：补 Few-shot / 上下文（进入 Context 工程）</p>
</div>
</div>
<div class="col">
<div class="card" style="text-align:center;border-top:4pt solid #16A085;">
<h3>③ 有能力做吗？</h3>
<p>否 → <b>能力问题</b>：换更强模型 / 拆任务</p>
</div>
</div>
</div>
<div class="card accent-l" style="margin-top:9pt;">
<h3>迭代闭环</h3>
<p style="margin:2pt 0;">建 10-30 个用例的测试集 → <b>单变量修改</b> → 全量回归 → Prompt 当代码管（Git + 版本号）。成本从低到高排查：先改 Prompt，再补信息，最后才换模型。</p>
</div></div>
<div class="ftr"><p>以教代学系列 · Prompt 工程速成</p><p>10 / 16</p></div>
</body></html>
