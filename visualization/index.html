<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Guru 知识图谱</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml" sizes="any">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080c14;--panel:#0d1219;--border:rgba(255,255,255,0.06);--accent:#63b3ed;--gold:#ffd700;--text:#d0d8e8;--muted:#5a6a80;--dim:#2a3444}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;display:flex}

#sidebar{width:300px;min-width:300px;height:100vh;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;overflow-y:auto;overflow-x:hidden}
#sidebar::-webkit-scrollbar{width:4px}
#sidebar::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}

.sb-section{padding:16px 20px;border-bottom:1px solid var(--border)}
.sb-section h3{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px}
.sb-section h4{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}

#search-input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;outline:none;transition:border-color .2s}
#search-input::placeholder{color:var(--dim)}
#search-input:focus{border-color:rgba(99,179,237,0.4)}

#node-info{min-height:120px}
#node-info .ni-empty{color:var(--muted);font-size:12px;line-height:1.6}
#node-info .ni-title{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px}
#node-info .ni-desc{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:8px}
#node-info .ni-diff{font-size:12px;color:var(--accent);margin-bottom:10px}
#node-info .ni-connections{display:flex;flex-direction:column;gap:4px}
#node-info .ni-conn{font-size:11px;color:var(--muted);padding:4px 8px;background:rgba(255,255,255,0.03);border-radius:4px;cursor:pointer;transition:background .15s}
#node-info .ni-conn:hover{background:rgba(99,179,237,0.1);color:var(--text)}
#node-info .ni-conn .conn-type{font-size:9px;padding:1px 5px;border-radius:3px;margin-right:6px;font-weight:600}
.conn-contains{background:rgba(255,255,255,0.08);color:#aaa}
.conn-prerequisite{background:rgba(246,173,85,0.15);color:#f6ad55}
.conn-application{background:rgba(252,129,129,0.15);color:#fc8181}
.conn-related{background:rgba(183,148,244,0.15);color:#b794f4}
.conn-learning_path{background:rgba(104,211,145,0.15);color:#68d391}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-card{background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.stat-card .sc-val{font-size:18px;font-weight:700;color:var(--accent)}
.stat-card .sc-label{font-size:10px;color:var(--muted);margin-top:2px}

.filter-btns{display:flex;flex-wrap:wrap;gap:6px}
.filter-btn{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;transition:all .2s}
.filter-btn:hover{background:rgba(255,255,255,0.08);color:var(--text)}
.filter-btn.active{background:rgba(99,179,237,0.12);border-color:rgba(99,179,237,0.3);color:var(--accent)}

.legend-list{display:flex;flex-direction:column;gap:6px}
.legend-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-line{width:18px;height:2px;border-radius:1px;flex-shrink:0}

#main{flex:1;position:relative;overflow:hidden}
svg{display:block}

.node-g{cursor:pointer}
.node-g circle{transition:r .3s,opacity .3s}
.link-line{stroke-linecap:round;transition:opacity .3s,stroke-width .3s}
.label-text{pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
.label-bg{pointer-events:none;fill:rgba(8,12,20,0.75);rx:3;ry:3}
</style>
</head>
<body>

<div id="sidebar">
  <div class="sb-section">
    <h3>搜索</h3>
    <input type="text" id="search-input" placeholder="输入关键词搜索节点..." />
  </div>
  <div class="sb-section" id="node-info">
    <h3>节点详情</h3>

  </div>
  <div class="sb-section">
    <h3>数据概览</h3>
    <div class="stat-grid">
      <div class="stat-card"><div class="sc-val" id="s-nodes">-</div><div class="sc-label">节点</div></div>
      <div class="stat-card"><div class="sc-val" id="s-links">-</div><div class="sc-label">连接</div></div>
      <div class="stat-card"><div class="sc-val">13</div><div class="sc-label">章节</div></div>
      <div class="stat-card"><div class="sc-val">290+</div><div class="sc-label">文档</div></div>
    </div>
  </div>
  <div class="sb-section">
    <h3>关系筛选</h3>
    <div class="filter-btns" id="filter-btns"></div>
  </div>
  <div class="sb-section">
    <h3>图例</h3>
    <div class="legend-list">
      <div class="legend-row"><div class="legend-dot" style="background:#ffd700"></div>知识库根节点</div>
      <div class="legend-row"><div class="legend-dot" style="background:#63b3ed"></div>章节 (Level 1)</div>
      <div class="legend-row"><div class="legend-dot" style="background:#a0aec0"></div>主题 (Level 2)</div>
      <div class="legend-row"><div class="legend-dot" style="background:#636e7f"></div>子话题 (Level 3)</div>
      <div class="legend-row"><div class="legend-dot" style="background:#68d391"></div>学习路径</div>
      <div style="height:4px"></div>
      <div class="legend-row"><div class="legend-line" style="background:rgba(160,174,192,0.3)"></div>层级</div>
      <div class="legend-row"><div class="legend-line" style="background:#f6ad55"></div>前置依赖</div>
      <div class="legend-row"><div class="legend-line" style="background:#fc8181"></div>应用</div>
      <div class="legend-row"><div class="legend-line" style="background:#b794f4"></div>关联</div>
      <div class="legend-row"><div class="legend-line" style="background:#68d391"></div>学习路径</div>
    </div>
  </div>
  <div class="sb-section" style="border-bottom:none">
    <h3>操作提示</h3>
    <div style="font-size:11px;color:var(--muted);line-height:1.8">
      <div>🖱 悬停节点 → 预览关联</div>
      <div>🖱 点击节点 → 锁定聚焦</div>
      <div>🖱 点击空白 → 回到中心</div>
      <div>🖱 滚轮缩放 / 拖拽平移</div>
      <div>🖱 拖拽节点 → 调整位置</div>
    </div>
  </div>
</div>

<div id="main">

</div>

<script>
function initGraph(){
  var data=GRAPH_DATA;
  var main=document.getElementById('main');
  var W=main.clientWidth,H=main.clientHeight;
  var svg=d3.select('#graph').attr('width',W).attr('height',H);
  var g=svg.append('g');
  var zoom=d3.zoom().scaleExtent([0.08,5]).on('zoom',function(e){g.attr('transform',e.transform)});
  svg.call(zoom);

  var colors={root:'#ffd700',chapter:'#63b3ed',topic:'#8a9ab5',detail:'#4a5568',meta:'#68d391'};
  var linkColors={contains:'rgba(100,120,150,0.2)',prerequisite:'#f6ad55',application:'#fc8181',related:'#b794f4',learning_path:'#68d391'};
  var linkW={contains:1,prerequisite:1.8,application:1.5,related:1.2,learning_path:1.4};
  var linkDash={contains:null,prerequisite:'6,3',application:'4,4',related:'2,4',learning_path:'8,4'};
  var radii={0:24,1:11,2:5.5,3:3};
  var fontSizes={0:14,1:9.5,2:7.5,3:6.5};

  document.getElementById('s-nodes').textContent=data.nodes.length;
  document.getElementById('s-links').textContent=data.links.length;

  var nMap={};data.nodes.forEach(function(n){nMap[n.id]=n});

  var linkG=g.append('g');
  var nodeG=g.append('g');
  var lblG=g.append('g');

  var activeTypes=new Set(['contains','prerequisite','application','related','learning_path']);
  var focusedId='root';

  function vis(l){return data.links.filter(function(x){return activeTypes.has(x.type)})}
  function visIds(){var s=new Set();vis().forEach(function(l){s.add(lid(l));s.add(tid(l))});if(activeTypes.has('contains'))data.nodes.forEach(function(n){s.add(n.id)});return s}
  function lid(l){return typeof l.source==='object'?l.source.id:l.source}
  function tid(l){return typeof l.target==='object'?l.target.id:l.target}
  function connected(id){var s=new Set([id]);data.links.forEach(function(l){if(lid(l)===id)s.add(tid(l));if(tid(l)===id)s.add(lid(l))});return s}

  var angleMap={};
  var chapters=data.nodes.filter(function(n){return n.level===1&&n.group==='chapter'});
  chapters.forEach(function(c,i){angleMap[c.id]=(i/chapters.length)*2*Math.PI-Math.PI/2});

  function initPos(n){
    var cx=W/2,cy=H/2;
    if(n.level===0)return{x:cx,y:cy};
    if(n.level===1){
      var a=angleMap[n.id]||0;var r=180;
      if(n.group==='meta')r=130;
      return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}
    }
    if(n.level===2){
      var p=nMap[n.parent||'root'];if(!p)return{x:cx,y:cy};
      var pa=angleMap[p.id]||Math.random()*Math.PI*2;var r2=100;
      return{x:(p.x||cx)+r2*Math.cos(pa+(Math.random()-0.5)*1.2),y:(p.y||cy)+r2*Math.sin(pa+(Math.random()-0.5)*1.2)}
    }
    if(n.level===3){
      var p2=nMap[n.parent||'root'];if(!p2)return{x:cx,y:cy};
      return{x:(p2.x||cx)+(Math.random()-0.5)*80,y:(p2.y||cy)+(Math.random()-0.5)*80}
    }
    return{x:cx,y:cy}
  }
  data.nodes.forEach(function(n){var p=initPos(n);n.x=p.x;n.y=p.y});

  var sim=d3.forceSimulation(data.nodes)
    .force('link',d3.forceLink(data.links).id(function(d){return d.id}).distance(function(d){
      if(d.type!=='contains')return 150;
      var sl=typeof d.source==='object'?d.source.level:0;
      var tl=typeof d.target==='object'?d.target.level:0;
      if(sl===0)return 200;if(sl===1&&tl===2)return 70;if(sl===2)return 45;return 90
    }).strength(function(d){return d.type==='contains'?0.7:0.2}))
    .force('charge',d3.forceManyBody().strength(function(d){return[-1200,-500,-120,-60][d.level]||-60}))
    .force('collision',d3.forceCollide().radius(function(d){return[50,26,14,9][d.level]||10}).strength(0.9))
    .force('center',d3.forceCenter(W/2,H/2).strength(0.03))
    .force('x',d3.forceX(W/2).strength(0.015))
    .force('y',d3.forceY(H/2).strength(0.015))
    .alphaDecay(0.015).velocityDecay(0.35);

  var linkEl,nodeEl,lblEl;

  function render(){
    var vl=vis(),vi=visIds(),vn=data.nodes.filter(function(n){return vi.has(n.id)});
    linkEl=linkG.selectAll('.link-line').data(vl,function(d){return lid(d)+'-'+tid(d)+'-'+d.type});
    linkEl.exit().remove();
    linkEl=linkEl.enter().append('line').attr('class','link-line')
      .attr('stroke',function(d){return linkColors[d.type]}).attr('stroke-width',function(d){return linkW[d.type]})
      .attr('stroke-dasharray',function(d){return linkDash[d.type]}).attr('opacity',0.01).merge(linkEl);

    nodeEl=nodeG.selectAll('.node-g').data(vn,function(d){return d.id});
    nodeEl.exit().remove();
    var ne=nodeEl.enter().append('g').attr('class','node-g')
      .call(d3.drag().on('start',ds).on('drag',dd).on('end',de))
      .on('mouseover',hov).on('mouseout',hout).on('click',clk);
    ne.append('circle').attr('class','nc')
      .attr('r',function(d){return radii[d.level]}).attr('fill',function(d){return colors[d.group]||colors.detail})
      .attr('stroke',function(d){return d.level===0?'#fff':'rgba(255,255,255,0.1)'}).attr('stroke-width',function(d){return d.level===0?2.5:0.5});
    ne.append('text').attr('class','nt label-text').attr('text-anchor','middle')
      .attr('dy',function(d){return radii[d.level]+fontSizes[d.level]+2}).attr('font-size',function(d){return fontSizes[d.level]})
      .attr('font-weight',function(d){return d.level<=1?600:400}).attr('fill',function(d){return d.level===0?'#fff':d.level===1?'#b8c4d8':'#7a8a9e'})
      .text(function(d){return d.label}).attr('opacity',0.01);
    nodeEl=ne.merge(nodeEl);

    sim.nodes(vn);sim.force('link').links(vl);sim.alpha(0.8).restart();
    sim.on('tick',function(){
      linkEl.attr('x1',function(d){return d.source.x}).attr('y1',function(d){return d.source.y}).attr('x2',function(d){return d.target.x}).attr('y2',function(d){return d.target.y});
      nodeEl.attr('transform',function(d){return'translate('+d.x+','+d.y+')'});
    });
    setTimeout(function(){applyFocus(focusedId)},500);
  }

  function ds(e,d){if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y}
  function dd(e,d){d.fx=e.x;d.fy=e.y}
  function de(e,d){if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}

  function applyFocus(fid){
    var conn=connected(fid);
    var focusLevel=nMap[fid]?nMap[fid].level:0;
    var showLevel3=(focusLevel>=1||fid==='root');

    nodeEl.transition().duration(350)
      .attr('opacity',function(n){
        if(!showLevel3&&n.level===3)return 0;
        return conn.has(n.id)?1:0.06;
      });
    nodeEl.select('.nc').transition().duration(350)
      .attr('r',function(n){
        if(n.id===fid)return radii[n.level]*1.5;
        return conn.has(n.id)?radii[n.level]:radii[n.level]*0.6;
      });

    nodeEl.select('.nt').transition().duration(350)
      .attr('opacity',function(n){
        if(n.level===3&&!showLevel3)return 0;
        if(n.id===fid)return 1;
        if(conn.has(n.id)){
          if(n.level<=1)return 1;if(n.level===2)return 0.85;if(n.level===3)return 0.7;return 1;
        }
        return n.level<=1?0.08:0;
      })
      .attr('fill',function(n){
        if(n.id===fid)return'#fff';
        return conn.has(n.id)?(n.level===1?'#b8c4d8':n.level===2?'#8a9ab5':'#6a7a8e'):'#333';
      });

    linkEl.transition().duration(350)
      .attr('opacity',function(l){return(lid(l)===fid||tid(l)===fid)?0.8:0.01})
      .attr('stroke-width',function(l){return(lid(l)===fid||tid(l)===fid)?linkW[l.type]*1.8:linkW[l.type]*0.2});
  }

  function updateInfo(d){
    var box=document.getElementById('node-info');
    if(!d){box.innerHTML='<h3>节点详情</h3><div class="ni-empty">点击或悬停节点查看详情</div>';return}
    var conns=[];
    data.links.forEach(function(l){
      var s=lid(l),t=tid(l);
      if(s===d.id)conns.push({id:t,type:l.type,label:nMap[t]?nMap[t].label:t,dir:'→'});
      if(t===d.id)conns.push({id:s,type:l.type,label:nMap[s]?nMap[s].label:s,dir:'←'});
    });
    var h='<h3>节点详情</h3><div class="ni-title">'+d.label+'</div>';
    if(d.description)h+='<div class="ni-desc">'+d.description+'</div>';
    if(d.difficulty)h+='<div class="ni-diff">难度 '+d.difficulty+'</div>';
    h+='<h4>关联节点 ('+conns.length+')</h4><div class="ni-connections">';
    conns.slice(0,20).forEach(function(c){
      h+='<div class="ni-conn" data-id="'+c.id+'"><span class="conn-type conn-'+c.type+'">'+c.type.replace('_',' ')+'</span>'+c.dir+' '+c.label+'</div>';
    });
    if(conns.length>20)h+='<div class="ni-conn" style="color:var(--muted)">...还有 '+(conns.length-20)+' 个</div>';
    h+='</div>';
    box.innerHTML=h;
    box.querySelectorAll('.ni-conn[data-id]').forEach(function(el){
      el.addEventListener('click',function(){
        var nid=el.getAttribute('data-id');
        focusedId=nid;applyFocus(nid);updateInfo(nMap[nid]);
      });
    });
  }

  var hoveredId=null;
  function hov(e,d){
    hoveredId=d.id;
    applyFocus(d.id);
    updateInfo(d);
  }
  function hout(){
    hoveredId=null;
    applyFocus(focusedId);
  }
  function clk(e,d){
    e.stopPropagation();
    focusedId=d.id;
    applyFocus(focusedId);
    updateInfo(d);
  }
  svg.on('click',function(){focusedId='root';applyFocus('root');updateInfo(null)});

  render();

  var fb={contains:'层级',prerequisite:'前置',application:'应用',related:'关联',learning_path:'学习路径'};
  var fbCont=document.getElementById('filter-btns');
  Object.keys(fb).forEach(function(t){
    var b=document.createElement('button');b.className='filter-btn active';b.textContent=fb[t];
    b.addEventListener('click',function(){
      if(activeTypes.has(t)){activeTypes.delete(t);b.classList.remove('active')}
      else{activeTypes.add(t);b.classList.add('active')}
      render();
    });
    fbCont.appendChild(b);
  });
  var rb=document.createElement('button');rb.className='filter-btn';rb.textContent='重置视图';
  rb.addEventListener('click',function(){
    svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity);
    focusedId='root';applyFocus('root');updateInfo(null);
  });
  fbCont.appendChild(rb);

  document.getElementById('search-input').addEventListener('input',function(){
    var q=this.value.trim().toLowerCase();
    if(!q){applyFocus(focusedId);return}
    nodeEl.transition().duration(200).attr('opacity',function(n){
      var m=n.label.toLowerCase().includes(q)||(n.description||'').toLowerCase().includes(q);
      return m?1:0.03;
    });
    nodeEl.select('.nt').transition().duration(200).attr('opacity',function(n){
      return n.label.toLowerCase().includes(q)?1:0;
    });
    linkEl.transition().duration(200).attr('opacity',function(l){
      var sl=l.source.label&&l.source.label.toLowerCase().includes(q);
      var tl=l.target.label&&l.target.label.toLowerCase().includes(q);
      return(sl||tl)?0.7:0.005;
    });
  });

  window.addEventListener('resize',function(){
    W=main.clientWidth;H=main.clientHeight;
    svg.attr('width',W).attr('height',H);
    sim.force('center',d3.forceCenter(W/2,H/2));
    sim.alpha(0.3).restart();
  });
}

function loadD3(){
  var s=document.createElement('script');s.src='https://d3js.org/d3.v7.min.js';
  s.onload=function(){initGraph()};
  s.onerror=function(){document.getElementById('main').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#fc8181;font-size:14px">D3.js 加载失败，请检查网络</div>'};
  document.head.appendChild(s);
}
if(typeof d3!=='undefined')initGraph();else loadD3();
</script>
</body>
</html>
