<!DOCTYPE html><html><head><style>html{background:#FAF8F5;}
body{width:720pt;height:405pt;margin:0;padding:0;background:#FAF8F5;font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif;display:flex;flex-direction:column;}

.hdr h1{color:#ffffff;font-size:19pt;margin:0;}
.body{padding:12pt 28pt 0 28pt;flex:1;}
.ftr{display:flex;justify-content:space-between;padding:4pt 28pt 6pt 28pt;}
.ftr p{color:#7F8C8D;font-size:8pt;margin:0;}
h2{color:#1C2833;font-size:14pt;margin:6pt 0 5pt 0;}
h3{color:#2E4053;font-size:12pt;margin:4pt 0 3pt 0;}
p{font-size:11pt;color:#2C3E50;margin:3pt 0;line-height:1.45;}
ul,ol{margin:3pt 0 3pt 16pt;padding:0;}
li{font-size:11pt;color:#2C3E50;margin:2.5pt 0;line-height:1.4;}

<div class="hdr"><div class="act"><p>第四幕 · 工程化</p></div><h1>生产级 Prompt 的六模块组装</h1></div>
<div class="body">
<div class="cols">
<div class="col" style="flex:1.15;">
<div class="card">
<h3>六模块模板</h3>
<ol>
<li><b>角色定义</b>（你是谁）</li>
<li><b>任务描述</b>（做什么）</li>
<li><b>约束条件</b>（边界与禁止项）</li>
<li><b>输入数据</b>（分隔符包裹）</li>
<li><b>输出格式</b>（Schema + 示例）</li>
<li><b>失败处理</b>（信息不足怎么办）</li>
</ol>
</div>
</div>
<div class="col">
<div class="card" style="background:#1C2833;">
<h3 style="color:#F5B041;">Agent 场景：按可缓存性分层</h3>
<p style="color:#ECF0F1;">静态模块（能力说明 / 领域知识）→ 放前面，吃<b>提示词缓存</b></p>
<p style="color:#ECF0F1;">动态模块（身份 / 当前会话）→ 放后面，每次重生成</p>
<p style="color:#F5B041;">缓存读取远便宜于重算：成本可降一个数量级</p>
</div>
</div>
</div></div>
<div class="ftr"><p>以教代学系列 · Prompt 工程速成</p><p>9 / 16</p></div>
</body></html>
