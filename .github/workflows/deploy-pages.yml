name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/前端应用
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0  # CI 无需 git hooks，且子目录 install 下 husky 找不到 .git 会失败

      # P0（2026-11-17）：public/mkdocs 已取消跟踪（252MB 构建产物），站点改由 CI 从 wiki/ 构建。
      # 必须排在 pnpm run build 之前——vite 会把 public/ 整体拷进 dist/。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/工具/requirements.txt

      - name: Build mkdocs site
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install -r code/工具/requirements.txt
          mkdocs build

      - name: Type check
        run: npx tsc --noEmit

      - name: Build for GitHub Pages
        run: pnpm run build
        env:
          GITHUB_PAGES: "true"

      - name: Copy doc markdown files to dist
        run: node scripts/copy-docs.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: code/前端应用/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
