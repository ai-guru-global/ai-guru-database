<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Guru Knowledge Base</title>
  <script>
    // GitHub Pages SPA fallback
    // Redirects 404 requests back to index.html, preserving the path
    // so that the React Router can handle client-side routing.
    var pathSegmentsToKeep = 1; // repo is at /<repo-name>/, keep 1 segment
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
