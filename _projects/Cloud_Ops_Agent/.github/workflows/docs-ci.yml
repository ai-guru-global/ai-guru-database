name: Docs CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '21_Cloud_Ops_Agent/docs/**'

jobs:
  quality_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Make scripts executable
        run: chmod +x 21_Cloud_Ops_Agent/scripts/quality_gate.sh

      - name: Run Quality Gate (Content, Links, Examples)
        run: |
          cd 21_Cloud_Ops_Agent
          ./scripts/quality_gate.sh

  build_mkdocs:
    runs-on: ubuntu-latest
    needs: quality_gate
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build Docs
        run: |
          cd 21_Cloud_Ops_Agent
          mkdocs build
