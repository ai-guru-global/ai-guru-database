site_name: AI Guru Database
site_description: CNCF-level knowledge base for AI documentation
site_author: AI Guru Team

docs_dir: mkdocs-docs
site_dir: Web/public/mkdocs

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang:
        - en
        - zh

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ai-guru-global/ai-guru-database

