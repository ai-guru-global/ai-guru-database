<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作台 — AI News Database</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Geist:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: oklch(18% 0.02 60);
            --ink-mid: oklch(38% 0.02 60);
            --paper: oklch(97.5% 0.008 75);
            --paper-white: oklch(99.2% 0.005 75);
            --stone: oklch(52% 0.02 70);
            --stone-light: oklch(70% 0.015 70);
            --stone-faint: oklch(90% 0.01 70);
            --accent: oklch(50% 0.15 25);
            --accent-soft: oklch(75% 0.1 25);
            --success: oklch(65% 0.15 145);
            --warning: oklch(75% 0.12 85);
            --radius: 6px;
            --font-body: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            --font-serif: 'EB Garamond', 'Noto Serif SC', 'Songti SC', 'SimSun', Georgia, serif;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }

        body {
            font-family: var(--font-body);
            background: var(--paper);
            color: var(--ink);
            line-height: 1.6;
            min-height: 100vh;
        }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }

        /* Header */
        header {
            position: sticky; top: 0; z-index: 50;
            background: oklch(97.5% 0.008 75 / 0.9);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--stone-faint);
        }
        .header-inner {
            max-width: 1100px; margin: 0 auto; padding: 0 1.25rem;
            height: 52px; display: flex; align-items: center; justify-content: space-between;
        }
        .brand { display: flex; align-items: baseline; gap: 0.4rem; text-decoration: none; color: var(--ink); }
        .brand-name { font-family: var(--font-serif); font-size: 1.05rem; font-weight: 500; }
        .brand-sep { color: var(--stone-light); }
        .brand-page { font-size: 0.78rem; color: var(--stone); }
        .header-right { display: flex; align-items: center; gap: 1rem; font-size: 0.78rem; color: var(--stone); }
        .sync-time { font-variant-numeric: tabular-nums; }

        /* Page */
        .page { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1.25rem 3rem; }

        /* Inbox Zero Banner */
        .inbox-banner {
            background: linear-gradient(135deg, var(--ink) 0%, oklch(30% 0.03 60) 100%);
            color: var(--paper);
            border-radius: var(--radius);
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .inbox-banner.processing { background: linear-gradient(135deg, oklch(40% 0.12 25) 0%, oklch(35% 0.1 25) 100%); }
        .inbox-banner.empty { background: linear-gradient(135deg, oklch(60% 0.12 145) 0%, oklch(50% 0.1 145) 100%); }
        .inbox-title { font-family: var(--font-serif); font-size: 1.4rem; font-weight: 500; margin-bottom: 0.2rem; }
        .inbox-sub { font-size: 0.82rem; opacity: 0.85; }
        .inbox-count { font-family: var(--font-serif); font-size: 2.5rem; font-weight: 500; opacity: 0.95; }
        .inbox-count-label { font-size: 0.78rem; opacity: 0.7; margin-top: 0.15rem; }
        .inbox-actions { display: flex; gap: 0.5rem; }
        .inbox-btn {
            padding: 0.4rem 0.85rem; border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1); color: inherit;
            border-radius: var(--radius); font-family: var(--font-body); font-size: 0.78rem;
            cursor: pointer; transition: background 0.15s;
        }
        .inbox-btn:hover { background: rgba(255,255,255,0.2); }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }
        @media (max-width: 640px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }
        .stat-card {
            background: var(--paper-white);
            border: 1px solid var(--stone-faint);
            border-radius: var(--radius);
            padding: 0.85rem 1rem;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        .stat-card:hover { box-shadow: 0 2px 8px oklch(0% 0 0 / 0.06); transform: translateY(-1px); }
        .stat-label { font-size: 0.68rem; color: var(--stone); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
        .stat-value { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 500; color: var(--ink); line-height: 1.1; }
        .stat-value.accent { color: var(--accent); }
        .stat-value.success { color: var(--success); }
        .stat-sub { font-size: 0.7rem; color: var(--stone-light); margin-top: 0.2rem; }

        /* Two Column Grid */
        .two-col { display: grid; grid-template-columns: 1fr 340px; gap: 1.25rem; }
        @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

        /* Panels */
        .panel { background: var(--paper-white); border: 1px solid var(--stone-faint); border-radius: var(--radius); overflow: hidden; }
        .panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.7rem 1rem; border-bottom: 1px solid var(--stone-faint);
            background: oklch(99.5% 0.002 75);
        }
        .panel-title { font-family: var(--font-serif); font-size: 0.92rem; font-weight: 500; display: flex; align-items: center; gap: 0.4rem; }
        .panel-title svg { width: 15px; height: 15px; color: var(--accent); }
        .panel-meta { font-size: 0.72rem; color: var(--stone); }

        /* Time Filters */
        .time-filters { display: flex; gap: 0.35rem; padding: 0.5rem 1rem; border-bottom: 1px solid var(--stone-faint); background: oklch(99.5% 0.002 75); }
        .time-btn {
            padding: 0.3rem 0.65rem; border: none; background: none;
            font-family: var(--font-body); font-size: 0.74rem; color: var(--stone);
            cursor: pointer; border-radius: 3px; transition: all 0.12s;
        }
        .time-btn:hover { color: var(--ink-mid); }
        .time-btn.active { color: var(--ink); background: var(--stone-faint); font-weight: 500; }
        .time-btn .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; background: var(--stone-faint); border-radius: 9px; font-size: 0.65rem; margin-left: 0.3rem; padding: 0 0.35rem; }
        .time-btn.active .badge { background: var(--accent); color: var(--paper); }

        /* Article List */
        .article-list { display: flex; flex-direction: column; }
        .article-item {
            display: grid; grid-template-columns: 2.5rem 1fr auto; gap: 0 0.65rem;
            align-items: start; padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--stone-faint);
            transition: background 0.1s;
        }
        .article-item:last-child { border-bottom: none; }
        .article-item:hover { background: oklch(97% 0.004 75); }
        .article-item.selected { background: oklch(90% 0.03 60 / 0.15); }

        .article-select { padding-top: 0.15rem; }
        .article-select input { width: 15px; height: 15px; cursor: pointer; accent-color: var(--accent); }

        .article-score {
            font-family: var(--font-serif); font-size: 0.8rem; color: var(--accent); font-weight: 500;
            padding-top: 0.1rem; min-width: 2rem;
        }
        .article-score.low { color: var(--stone-light); }
        .article-score.medium { color: oklch(60% 0.1 85); }

        .article-body { min-width: 0; }
        .article-title { font-size: 0.84rem; font-weight: 500; line-height: 1.4; margin-bottom: 0.25rem; }
        .article-title a { color: var(--ink); text-decoration: none; }
        .article-title a:hover { color: var(--accent); }

        .article-summary {
            font-size: 0.78rem; color: var(--stone); line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; margin-bottom: 0.35rem;
        }

        .article-meta { display: flex; align-items: center; gap: 0.4rem; font-size: 0.7rem; color: var(--stone-light); flex-wrap: wrap; }
        .article-meta .source { color: var(--stone); font-weight: 500; }
        .article-meta .dot { opacity: 0.5; }
        .article-meta .age { }
        .article-meta .tags { display: flex; gap: 0.25rem; }
        .article-meta .tag { background: var(--stone-faint); padding: 0.1em 0.4em; border-radius: 2px; }
        .article-meta .enriched { color: var(--success); }
        .article-meta .enriched::before { content: '◆ '; font-size: 0.6rem; }

        .article-actions { display: flex; gap: 0.25rem; padding-top: 0.1rem; }
        .art-btn {
            border: none; background: none; padding: 0.25rem; cursor: pointer;
            color: var(--stone-faint); border-radius: 3px; transition: color 0.12s;
            display: flex; align-items: center; justify-content: center;
        }
        .art-btn:hover { color: var(--ink-mid); }
        .art-btn.done { color: var(--success); }
        .art-btn.discard:hover { color: oklch(55% 0.15 25); }
        .art-btn svg { width: 14px; height: 14px; }

        .article-item.is-read .article-title { color: var(--stone-light); }
        .article-item.is-read .article-score { opacity: 0.5; }

        /* Selection Bar */
        .selection-bar {
            display: none; align-items: center; gap: 0.75rem;
            padding: 0.6rem 1rem; background: oklch(95% 0.02 60);
            border-bottom: 1px solid var(--stone-faint);
            font-size: 0.8rem;
        }
        .selection-bar.visible { display: flex; }
        .selection-count { font-weight: 500; color: var(--ink); }
        .selection-actions { display: flex; gap: 0.5rem; }
        .sel-btn {
            padding: 0.3rem 0.6rem; border: 1px solid var(--stone-faint);
            background: var(--paper-white); color: var(--ink);
            border-radius: var(--radius); font-family: var(--font-body); font-size: 0.75rem;
            cursor: pointer; transition: all 0.12s;
        }
        .sel-btn:hover { border-color: var(--stone-light); }
        .sel-btn.danger { border-color: oklch(60% 0.15 25); color: oklch(55% 0.15 25); }
        .sel-btn.danger:hover { background: oklch(97% 0.02 25); }

        /* Quick Actions */
        .quick-actions {
            display: flex; gap: 0.5rem; padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--stone-faint);
        }
        .qa-btn {
            display: inline-flex; align-items: center; gap: 0.35rem;
            padding: 0.45rem 0.85rem; border: 1px solid var(--stone-faint);
            background: var(--paper-white); color: var(--ink);
            border-radius: var(--radius); font-family: var(--font-body); font-size: 0.78rem;
            cursor: pointer; transition: all 0.15s;
        }
        .qa-btn:hover { border-color: var(--stone-light); background: var(--paper); }
        .qa-btn:active { transform: scale(0.98); }
        .qa-btn.loading { opacity: 0.7; cursor: wait; }
        .qa-btn.loading::after { content: ''; width: 10px; height: 10px; border: 1.5px solid var(--stone-light); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .qa-btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
        .qa-btn.primary:hover { opacity: 0.9; }
        .qa-btn svg { width: 13px; height: 13px; }
        .qa-hint { margin-left: auto; font-size: 0.72rem; color: var(--stone); display: flex; align-items: center; }

        /* Curate Section */
        .curate-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.75rem; padding: 0.75rem 1rem; }
        .curate-card {
            border: 1px solid var(--stone-faint); border-radius: var(--radius);
            padding: 0.85rem; transition: all 0.15s; cursor: pointer;
        }
        .curate-card:hover { border-color: var(--accent-soft); box-shadow: 0 2px 8px oklch(0% 0 0 / 0.05); }
        .curate-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.4rem; }
        .curate-score-badge { font-family: var(--font-serif); font-size: 0.85rem; color: var(--accent); font-weight: 500; }
        .curate-reason { font-size: 0.7rem; color: var(--stone); }
        .curate-card-title { font-size: 0.82rem; font-weight: 500; line-height: 1.4; margin-bottom: 0.35rem; }
        .curate-card-title a { color: var(--ink); text-decoration: none; }
        .curate-card-title a:hover { color: var(--accent); }
        .curate-card-tags { display: flex; gap: 0.25rem; flex-wrap: wrap; }
        .curate-card-tag { font-size: 0.65rem; background: var(--stone-faint); padding: 0.15em 0.4em; border-radius: 2px; color: var(--stone); }

        /* RAG Section */
        .rag-box { padding: 1rem; }
        .rag-input-row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
        .rag-input {
            flex: 1; padding: 0.55rem 0.85rem; border: 1px solid var(--stone-faint);
            border-radius: var(--radius); font-family: var(--font-body); font-size: 0.82rem;
            background: var(--paper-white); color: var(--ink); outline: none; transition: border-color 0.15s;
        }
        .rag-input:focus { border-color: var(--accent); }
        .rag-input::placeholder { color: var(--stone-light); }
        .rag-submit {
            padding: 0.55rem 1rem; border: none; background: var(--ink); color: var(--paper);
            border-radius: var(--radius); font-family: var(--font-body); font-size: 0.78rem;
            font-weight: 500; cursor: pointer; transition: opacity 0.12s;
            display: flex; align-items: center; gap: 0.35rem;
        }
        .rag-submit:hover { opacity: 0.85; }
        .rag-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        .rag-submit svg { width: 14px; height: 14px; }
        .rag-answer {
            background: oklch(99.5% 0.002 75); border: 1px solid var(--stone-faint);
            border-radius: var(--radius); padding: 1rem; font-size: 0.84rem; line-height: 1.75;
            min-height: 60px;
        }
        .rag-answer.streaming { border-left: 3px solid var(--accent); }
        .rag-empty { color: var(--stone-light); font-style: italic; text-align: center; padding: 1rem 0; }
        .rag-error { color: oklch(55% 0.15 25); background: oklch(97% 0.02 25 / 0.3); padding: 0.75rem; border-radius: var(--radius); font-size: 0.8rem; }
        .rag-citations { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--stone-faint); font-size: 0.75rem; color: var(--stone); }
        .rag-citations a { color: var(--accent); text-decoration: none; }
        .rag-citations a:hover { text-decoration: underline; }

        /* Focus Mode */
        .focus-controls { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 1rem; background: oklch(99.5% 0.002 75); border-bottom: 1px solid var(--stone-faint); }
        .focus-label { font-size: 0.74rem; color: var(--stone); }
        .focus-slider { flex: 1; max-width: 120px; accent-color: var(--accent); }
        .focus-value { font-size: 0.74rem; color: var(--accent); font-weight: 500; min-width: 2rem; }

        /* Reading Velocity */
        .velocity-bar { padding: 0.6rem 1rem; border-bottom: 1px solid var(--stone-faint); display: flex; align-items: center; gap: 0.75rem; }
        .velocity-label { font-size: 0.72rem; color: var(--stone); }
        .velocity-track { flex: 1; height: 4px; background: var(--stone-faint); border-radius: 2px; overflow: hidden; }
        .velocity-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }
        .velocity-text { font-size: 0.72rem; color: var(--stone); font-variant-numeric: tabular-nums; min-width: 3rem; text-align: right; }

        /* Empty States */
        .empty { padding: 2.5rem 1rem; text-align: center; }
        .empty svg { width: 36px; height: 36px; color: var(--stone-faint); margin-bottom: 0.75rem; }
        .empty-title { font-family: var(--font-serif); font-size: 1rem; font-weight: 400; margin-bottom: 0.3rem; }
        .empty-desc { font-size: 0.78rem; color: var(--stone); line-height: 1.6; }
        .empty-cmd { display: inline-block; margin-top: 0.75rem; padding: 0.35rem 0.75rem; background: var(--ink); color: var(--paper); border-radius: var(--radius); font-size: 0.75rem; }

        /* Loading */
        .loader { display: flex; align-items: center; justify-content: center; padding: 2rem 0; gap: 0.4rem; }
        .loader-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--stone-light); animation: dot 1s ease infinite; }
        .loader-dot:nth-child(2) { animation-delay: 0.12s; }
        .loader-dot:nth-child(3) { animation-delay: 0.24s; }
        @keyframes dot { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

        /* Toast */
        .toast { position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%) translateY(80px); padding: 0.5rem 1rem; background: var(--ink); color: var(--paper); border-radius: var(--radius); font-size: 0.8rem; z-index: 100; transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); pointer-events: none; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: oklch(55% 0.15 25); }
        .toast.success { background: var(--success); }

        /* Sidebar Stack */
        .sidebar { display: flex; flex-direction: column; gap: 1rem; }

        /* Footer */
        footer { max-width: 1100px; margin: 2rem auto 0; padding: 1rem 1.25rem 2rem; font-size: 0.72rem; color: var(--stone-light); text-align: center; }
        footer a { color: var(--stone); text-decoration: none; }
        footer a:hover { color: var(--accent); }

        /* Animations */
        .fade-in { animation: fadeIn 0.35s ease forwards; opacity: 0; }
        @keyframes fadeIn { to { opacity: 1; } }
        .stagger-1 { animation-delay: 0.05s; } .stagger-2 { animation-delay: 0.1s; } .stagger-3 { animation-delay: 0.15s; } .stagger-4 { animation-delay: 0.2s; }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="/" class="brand">
                <span class="brand-name">AI News Database</span>
                <span class="brand-sep">/</span>
                <span class="brand-page">工作台</span>
            </a>
            <div class="header-right">
                <span class="sync-time" id="sync-time">—</span>
            </div>
        </div>
    </header>

    <main class="page">
        <!-- Inbox Zero Banner -->
        <div class="inbox-banner" id="inbox-banner">
            <div>
                <div class="inbox-title" id="inbox-title">收件箱</div>
                <div class="inbox-sub" id="inbox-sub">还有篇未读文章等待处理</div>
            </div>
            <div style="text-align:right">
                <div class="inbox-count" id="inbox-count">0</div>
                <div class="inbox-count-label">未读</div>
            </div>
            <div class="inbox-actions" id="inbox-actions">
                <button class="inbox-btn" onclick="markAllRead()">全部已读</button>
            </div>
        </div>

        <!-- Stats Row -->
        <div class="stats-row">
            <div class="stat-card fade-in stagger-1">
                <div class="stat-label">今日新增</div>
                <div class="stat-value" id="stat-today">—</div>
                <div class="stat-sub">同步于 <span id="stat-last-sync">—</span></div>
            </div>
            <div class="stat-card fade-in stagger-2">
                <div class="stat-label">本周阅读</div>
                <div class="stat-value success" id="stat-week-read">—</div>
                <div class="stat-sub">完成率 <span id="stat-completion">—</span></div>
            </div>
            <div class="stat-card fade-in stagger-3">
                <div class="stat-label">已增强</div>
                <div class="stat-value accent" id="stat-enriched">—</div>
                <div class="stat-sub">LLM 处理</div>
            </div>
            <div class="stat-card fade-in stagger-4">
                <div class="stat-label">阅读速度</div>
                <div class="stat-value" id="stat-velocity">—</div>
                <div class="stat-sub">篇/天</div>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="two-col">
            <div class="main">
                <!-- Reading List Panel -->
                <div class="panel fade-in">
                    <div class="panel-header">
                        <span class="panel-title">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                            阅读队列
                        </span>
                        <span class="panel-meta" id="list-meta">加载中...</span>
                    </div>

                    <!-- Quick Actions -->
                    <div class="quick-actions">
                        <button class="qa-btn primary" id="btn-sync" onclick="doSync()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                            同步
                        </button>
                        <button class="qa-btn" id="btn-enrich" onclick="doEnrich()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                            增强
                        </button>
                        <button class="qa-btn" onclick="doDigest()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                            生成摘要
                        </button>
                        <div class="qa-hint">
                            <span id="qa-hint-text">选中项可批量操作</span>
                        </div>
                    </div>

                    <!-- Selection Bar -->
                    <div class="selection-bar" id="selection-bar">
                        <span class="selection-count" id="selection-count">0 篇已选</span>
                        <div class="selection-actions">
                            <button class="sel-btn" onclick="markSelectedRead()">标记已读</button>
                            <button class="sel-btn" onclick="markSelectedStar()">收藏</button>
                            <button class="sel-btn danger" onclick="discardSelected()">丢弃</button>
                            <button class="sel-btn" onclick="clearSelection()">取消选择</button>
                        </div>
                    </div>

                    <!-- Focus Mode -->
                    <div class="focus-controls">
                        <span class="focus-label">质量过滤：</span>
                        <input type="range" class="focus-slider" id="quality-filter" min="0" max="10" step="0.5" value="0" oninput="updateQualityFilter()">
                        <span class="focus-value" id="quality-value">0</span>
                        <span class="focus-label">分以上</span>
                    </div>

                    <!-- Time Filters -->
                    <div class="time-filters">
                        <button class="time-btn active" data-time="all" onclick="setTimeFilter('all')">全部<span class="badge" id="badge-all">0</span></button>
                        <button class="time-btn" data-time="today" onclick="setTimeFilter('today')">今天<span class="badge" id="badge-today">0</span></button>
                        <button class="time-btn" data-time="week" onclick="setTimeFilter('week')">本周<span class="badge" id="badge-week">0</span></button>
                        <button class="time-btn" data-time="older" onclick="setTimeFilter('older')">更早<span class="badge" id="badge-older">0</span></button>
                    </div>

                    <!-- Article List -->
                    <div class="article-list" id="article-list">
                        <div class="loader"><span class="loader-dot"></span><span class="loader-dot"></span><span class="loader-dot"></span></div>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="sidebar">
                <!-- Curate Panel -->
                <div class="panel fade-in">
                    <div class="panel-header">
                        <span class="panel-title">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                            今日精选
                        </span>
                        <span class="panel-meta" id="curate-count">0 篇</span>
                    </div>
                    <div class="curate-grid" id="curate-list">
                        <div class="loader"><span class="loader-dot"></span><span class="loader-dot"></span><span class="loader-dot"></span></div>
                    </div>
                </div>

                <!-- RAG Panel -->
                <div class="panel fade-in">
                    <div class="panel-header">
                        <span class="panel-title">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                            知识问答
                        </span>
                    </div>
                    <div class="rag-box">
                        <div class="rag-input-row">
                            <input type="text" class="rag-input" id="rag-input" placeholder="基于本地知识库提问..." onkeydown="if(event.key==='Enter')doAsk()">
                            <button class="rag-submit" id="rag-submit" onclick="doAsk()">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                                提问
                            </button>
                        </div>
                        <div class="rag-answer" id="rag-answer">
                            <div class="rag-empty">知识库检索 + LLM 推理回答</div>
                        </div>
                    </div>
                </div>

                <!-- Sources Panel -->
                <div class="panel fade-in">
                    <div class="panel-header">
                        <span class="panel-title">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                            信息源
                        </span>
                    </div>
                    <div class="panel-body" id="sources-list" style="max-height:200px;overflow-y:auto;">
                        <div class="loader"><span class="loader-dot"></span><span class="loader-dot"></span><span class="loader-dot"></span></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>AI News Database · 本地优先 · <a href="/inspire">灵感</a></footer>

    <div class="toast" id="toast"></div>

    <script>
        const API = '';
        const state = {
            articles: [],
            allArticles: [],
            curate: [],
            sources: [],
            filter: 'all',
            timeFilter: 'all',
            qualityThreshold: 0,
            selected: new Set()
        };

        async function init() {
            await Promise.all([loadAll(), updateTime()]);
        }

        async function loadAll() {
            await Promise.all([loadStats(), loadArticles(), loadCurate(), loadSources()]);
            updateInboxBanner();
        }

        async function loadStats() {
            try {
                const resp = await fetch(API + '/api/stats');
                const data = await resp.json();
                state.stats = data;
                renderStats();
            } catch (e) { renderStatsEmpty(); }
        }

        function renderStats() {
            const s = state.stats;
            document.getElementById('stat-enriched').textContent = s.enriched || 0;

            // Calculate today/week stats from articles
            const today = new Date();
            today.setHours(0,0,0,0);
            const weekAgo = new Date(today.getTime() - 7 * 86400000);

            let todayCount = 0, weekRead = 0, total = 0;
            state.allArticles.forEach(a => {
                total++;
                const d = new Date(a.fetched_at);
                if (d >= today) todayCount++;
            });

            const unread = s.unread || 0;
            const read = s.read || 0;
            if (total > 0) {
                const completion = Math.round((read / total) * 100);
                document.getElementById('stat-completion').textContent = completion + '%';
            }
            document.getElementById('stat-today').textContent = todayCount;
            document.getElementById('stat-velocity').textContent = (total / 7).toFixed(1);
        }

        function renderStatsEmpty() {
            ['stat-today','stat-enriched','stat-velocity','stat-week-read'].forEach(id => document.getElementById(id).textContent = '0');
            document.getElementById('stat-completion').textContent = '0%';
        }

        async function loadArticles() {
            try {
                const resp = await fetch(API + '/api/articles?filter=unread');
                const data = await resp.json();
                state.allArticles = state.articles = data.items || [];
                renderArticles();
                updateTimeBadges();
            } catch (e) {
                document.getElementById('article-list').innerHTML = '<div class="empty"><p class="empty-title">加载失败</p></div>';
            }
        }

        function renderArticles() {
            const list = document.getElementById('article-list');

            let items = state.articles;

            // Time filter
            const today = new Date(); today.setHours(0,0,0,0);
            const weekAgo = new Date(today.getTime() - 7 * 86400000);

            if (state.timeFilter === 'today') {
                items = items.filter(a => new Date(a.fetched_at) >= today);
            } else if (state.timeFilter === 'week') {
                items = items.filter(a => { const d = new Date(a.fetched_at); return d >= weekAgo && d < today; });
            } else if (state.timeFilter === 'older') {
                items = items.filter(a => new Date(a.fetched_at) < weekAgo);
            }

            // Quality filter
            if (state.qualityThreshold > 0) {
                items = items.filter(a => (a.quality_score || 0) >= state.qualityThreshold);
            }

            document.getElementById('list-meta').textContent = `${items.length} 篇`;

            if (items.length === 0) {
                list.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg><p class="empty-title">队列空闲</p><p class="empty-desc">运行同步获取新内容</p></div>';
                return;
            }

            list.innerHTML = items.slice(0, 30).map((item, idx) => {
                const isRead = item.read_status === 'read';
                const isStarred = item.read_status === 'starred';
                const score = item.quality_score || 0;
                const scoreClass = score >= 7 ? '' : score >= 4 ? 'medium' : 'low';
                const scoreStr = score > 0 ? score.toFixed(1) : '—';
                const enriched = item.llm_summary ? '<span class="enriched">已摘要</span>' : '';
                const age = formatAge(item.fetched_at);
                const tags = item.llm_tags ? item.llm_tags.split(',').slice(0, 2).join(' ').split(' ').filter(t => t).map(t => `<span class="tag">${esc(t)}</span>`).join('') : '';

                return `<div class="article-item${isRead ? ' is-read' : ''}${state.selected.has(item.id) ? ' selected' : ''}" data-id="${item.id}">
                    <div class="article-select"><input type="checkbox" ${state.selected.has(item.id) ? 'checked' : ''} onchange="toggleSelect(${item.id}, this.checked)"></div>
                    <div class="article-score ${scoreClass}">${scoreStr}</div>
                    <div class="article-body">
                        <div class="article-title"><a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.title)}</a></div>
                        ${item.llm_summary ? `<div class="article-summary">${esc(item.llm_summary)}</div>` : ''}
                        <div class="article-meta">
                            <span class="source">${esc(item.source_alias)}</span>
                            <span class="dot">·</span>
                            <span class="age">${age}</span>
                            ${enriched ? `<span class="dot">·</span>${enriched}` : ''}
                            ${tags ? `<span class="dot">·</span><span class="tags">${tags}</span>` : ''}
                        </div>
                    </div>
                    <div class="article-actions">
                        ${!isRead ? `<button class="art-btn" onclick="markStatus(${item.id}, 'read')" title="已读"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></button>` : ''}
                        <button class="art-btn${isStarred ? ' done' : ''}" onclick="markStatus(${item.id}, 'starred')" title="收藏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
                        <button class="art-btn discard" onclick="markStatus(${item.id}, 'discarded')" title="丢弃"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
                    </div>
                </div>`;
            }).join('');
        }

        function updateTimeBadges() {
            const today = new Date(); today.setHours(0,0,0,0);
            const weekAgo = new Date(today.getTime() - 7 * 86400000);
            let todayCount = 0, weekCount = 0, olderCount = 0;
            state.allArticles.forEach(a => {
                const d = new Date(a.fetched_at);
                if (d >= today) todayCount++;
                else if (d >= weekAgo) weekCount++;
                else olderCount++;
            });
            const allCount = state.allArticles.length;
            document.getElementById('badge-all').textContent = allCount;
            document.getElementById('badge-today').textContent = todayCount;
            document.getElementById('badge-week').textContent = weekCount;
            document.getElementById('badge-older').textContent = olderCount;
        }

        async function loadCurate() {
            try {
                const resp = await fetch(API + '/api/curate');
                const data = await resp.json();
                state.curate = data.items || [];
                renderCurate();
            } catch (e) {
                document.getElementById('curate-list').innerHTML = '<div class="empty"><p class="empty-desc">加载失败</p></div>';
            }
        }

        function renderCurate() {
            const list = document.getElementById('curate-list');
            document.getElementById('curate-count').textContent = `${state.curate.length} 篇`;
            if (state.curate.length === 0) {
                list.innerHTML = '<div class="empty"><p class="empty-desc">同步 + 增强后生成精选</p></div>';
                return;
            }
            list.innerHTML = state.curate.map(item => {
                const tags = item.tags ? item.tags.split(',').slice(0, 3).join(' ').split(' ').filter(t => t).map(t => `<span class="curate-card-tag">${esc(t)}</span>`).join('') : '';
                return `<div class="curate-card">
                    <div class="curate-card-header">
                        <span class="curate-score-badge">${(item.score || 0).toFixed(1)}</span>
                        <span class="curate-reason">${esc(item.reason || '精选')}</span>
                    </div>
                    <div class="curate-card-title"><a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.title)}</a></div>
                    ${tags ? `<div class="curate-card-tags">${tags}</div>` : ''}
                </div>`;
            }).join('');
        }

        async function loadSources() {
            try {
                const resp = await fetch(API + '/api/sources');
                const data = await resp.json();
                state.sources = data.sources || [];
                renderSources();
            } catch (e) {
                document.getElementById('sources-list').innerHTML = '<div class="empty"><p class="empty-desc">加载失败</p></div>';
            }
        }

        function renderSources() {
            const list = document.getElementById('sources-list');
            if (state.sources.length === 0) {
                list.innerHTML = '<div class="empty"><p class="empty-desc">暂无订阅</p></div>';
                return;
            }
            list.innerHTML = state.sources.map(s => `<div style="display:flex;justify-content:space-between;padding:0.4rem 0;border-bottom:1px solid var(--stone-faint);font-size:0.8rem;"><span>${esc(s.name)}</span><span style="color:var(--stone)">—</span></div>`).join('');
        }

        // Actions
        async function doSync() {
            const btn = document.getElementById('btn-sync');
            btn.classList.add('loading'); btn.disabled = true;
            setStatus('同步中...');
            try {
                const resp = await fetch(API + '/api/sync', { method: 'POST' });
                const data = await resp.json();
                toast(data.message || '同步完成', 'success');
                await loadAll();
                document.getElementById('sync-time').textContent = '刚刚';
            } catch (e) {
                toast('同步失败', 'error');
            } finally {
                btn.classList.remove('loading'); btn.disabled = false;
            }
        }

        async function doEnrich() {
            const btn = document.getElementById('btn-enrich');
            btn.classList.add('loading'); btn.disabled = true;
            setStatus('增强中...');
            try {
                const resp = await fetch(API + '/api/enrich', { method: 'POST' });
                const data = await resp.json();
                toast(`完成 ${data.success}/${data.total}`, 'success');
                await loadAll();
            } catch (e) {
                toast('增强失败', 'error');
            } finally {
                btn.classList.remove('loading'); btn.disabled = false;
            }
        }

        async function doDigest() {
            toast('摘要生成中...', 'success');
        }

        async function doAsk() {
            const input = document.getElementById('rag-input');
            const submit = document.getElementById('rag-submit');
            const answer = document.getElementById('rag-answer');
            const q = input.value.trim();
            if (!q) return;
            submit.disabled = true;
            answer.innerHTML = '<div class="rag-empty">思考中...</div>';
            answer.classList.add('streaming');
            try {
                const resp = await fetch(API + '/api/ask', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: q })
                });
                const data = await resp.json();
                if (data.error) { answer.innerHTML = `<div class="rag-error">${esc(data.error)}</div>`; return; }
                // Stream
                let displayed = '';
                answer.innerHTML = '<div id="rag-txt"></div><div class="rag-citations" id="rag-refs" style="display:none"></div>';
                for (let i = 0; i < data.answer.length; i++) {
                    displayed += data.answer[i];
                    document.getElementById('rag-txt').textContent = displayed + '▍';
                    await sleep(12);
                }
                document.getElementById('rag-txt').textContent = displayed;
                if (data.refs && data.refs.length > 0) {
                    const refs = document.getElementById('rag-refs');
                    refs.style.display = 'block';
                    refs.innerHTML = '<strong>引用：</strong>' + data.refs.map((r, i) => `<a href="${esc(r.url)}" target="_blank">${i+1}. ${esc(r.title)}</a>`).join(' · ');
                }
            } catch (e) {
                answer.innerHTML = '<div class="rag-error">请求失败</div>';
            } finally {
                submit.disabled = false;
                answer.classList.remove('streaming');
            }
        }

        async function markStatus(id, status) {
            try {
                await fetch(API + `/api/articles/${id}/status`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                toast('已更新', 'success');
                state.selected.delete(id);
                updateSelectionUI();
                await loadAll();
            } catch (e) { toast('更新失败', 'error'); }
        }

        function toggleSelect(id, checked) {
            if (checked) state.selected.add(id);
            else state.selected.delete(id);
            updateSelectionUI();
            renderArticles();
        }

        function updateSelectionUI() {
            const bar = document.getElementById('selection-bar');
            const count = document.getElementById('selection-count');
            if (state.selected.size > 0) {
                bar.classList.add('visible');
                count.textContent = `${state.selected.size} 篇已选`;
            } else {
                bar.classList.remove('visible');
            }
        }

        async function markSelectedRead() {
            for (const id of state.selected) await markStatus(id, 'read');
            state.selected.clear();
            updateSelectionUI();
        }

        async function markSelectedStar() {
            for (const id of state.selected) await markStatus(id, 'starred');
            state.selected.clear();
            updateSelectionUI();
        }

        async function discardSelected() {
            for (const id of state.selected) await markStatus(id, 'discarded');
            state.selected.clear();
            updateSelectionUI();
        }

        function clearSelection() {
            state.selected.clear();
            updateSelectionUI();
            renderArticles();
        }

        async function markAllRead() {
            const unread = state.allArticles.filter(a => a.read_status === 'unread');
            for (const a of unread) await markStatus(a.id, 'read');
            toast('全部已读', 'success');
        }

        function setTimeFilter(t) {
            state.timeFilter = t;
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.time-btn[data-time="${t}"]`).classList.add('active');
            renderArticles();
        }

        function updateQualityFilter() {
            const v = parseFloat(document.getElementById('quality-filter').value);
            state.qualityThreshold = v;
            document.getElementById('quality-value').textContent = v;
            renderArticles();
        }

        function updateInboxBanner() {
            const unread = state.allArticles.filter(a => a.read_status === 'unread').length;
            document.getElementById('inbox-count').textContent = unread;
            const banner = document.getElementById('inbox-banner');
            const title = document.getElementById('inbox-title');
            const sub = document.getElementById('inbox-sub');
            const actions = document.getElementById('inbox-actions');

            banner.className = 'inbox-banner';
            if (unread === 0) {
                banner.classList.add('empty');
                title.textContent = '收件箱清零';
                sub.textContent = '所有文章已处理，干得漂亮！';
                actions.style.display = 'none';
            } else if (unread <= 5) {
                banner.classList.add('processing');
                title.textContent = '收件箱';
                sub.textContent = `${unread} 篇文章等待处理`;
                actions.style.display = 'flex';
            } else {
                title.textContent = '收件箱';
                sub.textContent = `${unread} 篇文章积压中，建议批量处理`;
                actions.style.display = 'flex';
            }
        }

        function updateTime() {
            const el = document.getElementById('sync-time');
            el.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        // Utils
        function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function formatAge(dateStr) {
            const d = new Date(dateStr);
            const now = new Date();
            const diff = now - d;
            const mins = Math.floor(diff / 60000);
            if (mins < 60) return `${mins} 分钟前`;
            const hours = Math.floor(mins / 60);
            if (hours < 24) return `${hours} 小时前`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days} 天前`;
            return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
        }
        function setStatus(msg) { document.getElementById('qa-hint-text').textContent = msg; }
        function toast(msg, type = '') {
            const el = document.getElementById('toast');
            el.textContent = msg; el.className = 'toast' + (type ? ` ${type}` : '');
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }
        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        init();
    </script>
</body>
</html>
