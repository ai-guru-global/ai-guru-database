name: CI

# P1-1b：工具回归 + 前端四件套。任何一项失败即拦截合并。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pytest（工具回归测试）
        run: python3 -m pytest code/工具/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/前端应用
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0  # CI 无需 git hooks，且子目录 install 下 husky 找不到 .git 会失败

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test
