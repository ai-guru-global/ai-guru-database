name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/前端应用
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0  # CI 无需 git hooks，且子目录 install 下 husky 找不到 .git 会失败

      # P0（2026-11-17）：public/mkdocs 已取消跟踪（252MB 构建产物），站点改由 CI 从 wiki/ 构建。
      # 必须排在 pnpm run build 之前——vite 会把 public/ 整体拷进 dist/。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/工具/requirements.txt

      - name: Build mkdocs site
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install -r code/工具/requirements.txt
          mkdocs build

      # portal 的阅读分片（data/pages/）与发布站（console/site/）都是 gitignore 的
      # 构建产物，checkout 里没有——必须在打包前现构建（依赖上一步装好的 markdown）。
      - name: Build portal data and console site
        working-directory: ${{ github.workspace }}/console
        run: |
          python3 tools/scripts/build_portal.py
          python3 tools/scripts/build_pages.py

      - name: Type check
        run: npx tsc --noEmit

      - name: Build for GitHub Pages
        run: pnpm run build
        env:
          GITHUB_PAGES: "true"

      - name: Copy doc markdown files to dist
        run: node scripts/copy-docs.js

      # Portal 上线（2026-11-19 拍板）：五面同源——portal 本体 + 发布站/拆解台随包，
      # 文档站走同源 ../mkdocs/，前端应用即站点根。data.local.js 为 gitignore 的本机数据，
      # CI 无此文件（拆解台按设计容忍缺失，研判面板留空）。
      # 注意：job 默认 working-directory 是 code/前端应用，此步显式用仓库根——
      # 但上传路径是 code/前端应用/dist，所有目标必须写全路径（曾因 dist/歧义打错目录）。
      - name: Copy portal and static surfaces into dist
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf code/前端应用/dist/portal
          mkdir -p code/前端应用/dist/portal/surfaces
          cp -r design/统一入口/. code/前端应用/dist/portal/
          rm -rf code/前端应用/dist/portal/.hallmark
          cp -r console/site code/前端应用/dist/portal/surfaces/site
          cp -r console/console code/前端应用/dist/portal/surfaces/console

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: code/前端应用/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
