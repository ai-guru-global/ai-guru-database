name: Debt Report

# P1-2：按目录聚合的健康债务周报。报告只进 Job Summary 与构件，不入库。
on:
  schedule:
    - cron: '0 4 * * 1'  # 每周一 04:00 UTC
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成债务周报
        run: python3 code/工具/debt_report.py --json debt-report.json | tee "$GITHUB_STEP_SUMMARY"

      - name: 上传报告构件
        uses: actions/upload-artifact@v4
        with:
          name: debt-report
          path: debt-report.json
          retention-days: 90
